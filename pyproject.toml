[project]
name = "surface_analyses"
version = "0.3"
description = "PEP-Patch: Electrostatics and hydrophobicity analyses of protein surfaces"
authors = [{ name = "Franz Waibl", email = "franz.waibl@uibk.ac.at" }]
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-image",
    "plyfile",
    "matplotlib>=3.7",
    "pdb2pqr>=3",
    "biopython",
    "rdkit",
    "mdtraj>=1.11",
    "numba",
    "gisttools",
    "msms-wrapper",
]

[project.scripts]
pep_patch_hydrophobic = "surface_analyses.commandline_hydrophobic:main"
pep_patch_electrostatic = "surface_analyses.commandline_electrostatic:main"
pep_patch_gui = "surface_analyses.pep_patch_gui:main"
pep_patch_analyze = "src.unified_analyzer:main"
pep_patch_summary = "src.batch_summary:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
gisttools = { git = "https://github.com/liedllab/gisttools.git" }
msms-wrapper = { git = "https://github.com/rinikerlab/msms_wrapper.git" }

[tool.setuptools.packages.find]
include = ["surface_analyses*"]

